## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
bat.pkg-path = "bat"
bat.version = "0.26.0"
atuin.pkg-path = "atuin"
atuin.version = "18.8.0"
zellij.pkg-path = "zellij"
zellij.version = "0.43.1"
starship.pkg-path = "starship"
starship.version = "1.24.0"
lazygit.pkg-path = "lazygit"
lazygit.version = "0.56.0"
yazi.pkg-path = "yazi"
yazi.version = "25.5.31"
helix.pkg-path = "helix"
helix.version = "25.07.1"
dotbot.pkg-path = "dotbot"
dotbot.version = "1.23.1"
eza.pkg-path = "eza"
eza.version = "0.23.4"
fzf.pkg-path = "fzf" # installing particular version was not sucessful
zoxide.pkg-path = "zoxide"
zoxide.version = "0.9.8"
git.pkg-path = "git" # installing particular version was not sucessful
devpod.pkg-path = "devpod"
devpod.version = "0.6.15"
go-task.pkg-path = "go-task"
lazydocker.pkg-path = "lazydocker"
lazydocker.version = "0.24"
python3.pkg-path = "python3"
python3.version = "3.13" # Newer version was not available at the time 2025.12.17
go.pkg-path = "go"
go.version = "1.25"
R.pkg-path = "R"
R.version = "4.5"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]
# [build.myproject]
# description = "The coolest project ever"
# version = "0.0.1"
# command = """
#   mkdir -p $out/bin
#   cargo build --release
#   cp target/release/myproject $out/bin/myproject
# """


## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
# systems = [
#   "aarch64-darwin",
#   "aarch64-linux",
#   "x86_64-darwin",
#   "x86_64-linux",
# ]
# Uncomment to disable CUDA detection.
# cuda-detection = false

[options.allow]
# Allow unfree packages (enabled per user request)
unfree = true
